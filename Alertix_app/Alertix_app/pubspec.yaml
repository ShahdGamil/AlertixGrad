name: alertix_app
description: Smart Supermarket Theft Detection System - AI-powered security monitoring with real-time alerts.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase - Temporarily disabled for web testing
  # firebase_core: ^2.24.2
  # firebase_auth: ^4.16.0
  # firebase_messaging: ^14.7.10
  # cloud_firestore: ^4.14.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Networking
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Components
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  photo_view: ^0.14.0
  flutter_staggered_grid_view: ^0.7.0

  # Utilities
  intl: ^0.18.1
  uuid: ^4.3.3
  path_provider: ^2.1.2
  permission_handler: ^11.2.0

  # Audio & Vibration
  audioplayers: ^5.2.1
  vibration: ^1.8.4

  # Notifications
  flutter_local_notifications: ^16.3.2

  # Image handling
  image: ^4.1.7
  image_picker: ^1.0.7

  # Icons
  cupertino_icons: ^1.0.6
  flutter_vector_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/icons/

