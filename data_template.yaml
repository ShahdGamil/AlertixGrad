# Merged Shoplifting Detection Dataset Configuration
# This is a template - actual data.yaml will be generated by the notebook
# Generated: 2026-01-03

# Dataset paths (will be auto-generated)
path: /path/to/merged_shoplifting_dataset  # Root directory
train: train/images  # Training images (relative to path)
val: valid/images    # Validation images (relative to path)
test: test/images    # Test images (relative to path)

# Number of classes
nc: 2

# Class names
names:
  0: normal
  1: theft

# Dataset metadata
info:
  description: Merged shoplifting detection dataset from B1, B2, B3 sources
  version: 1.0
  created: 2026-01-03
  author: Data Preprocessing Pipeline
  license: CC BY 4.0

  # Source datasets
  sources:
    - name: cc-tv-footage-annotation-b8-lcysc b1
      original_classes: 6
      mapped_classes: 2
      images: 2998

    - name: shoplifting-detection b2
      original_classes: 2
      mapped_classes: 2
      images: 7111

    - name: test-make b3
      original_classes: 2
      mapped_classes: 2
      images: 1194

  # Total statistics
  total:
    images: 11303
    classes: 2
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15

# Class mapping from original B1 dataset
class_mapping:
  B1_original_to_unified:
    0_Customer-Bagpack: 0_normal
    1_Product: 0_normal
    2_Product-Picked: 1_theft
    3_Shopping-Cart: 0_normal
    4_normal: 0_normal
    5_theft: 1_theft

# Training hyperparameters (YOLOv8 defaults with custom augmentation)
hyperparameters:
  # Model
  model: yolov8n.pt  # nano, small, medium, large, xlarge

  # Training
  epochs: 100
  batch: 16
  imgsz: 640

  # Optimizer
  optimizer: AdamW
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005

  # Augmentation
  augmentation:
    hsv_h: 0.015        # HSV-Hue augmentation (fraction)
    hsv_s: 0.7          # HSV-Saturation augmentation (fraction)
    hsv_v: 0.4          # HSV-Value augmentation (fraction)
    degrees: 10.0       # Image rotation (+/- deg)
    translate: 0.1      # Image translation (+/- fraction)
    scale: 0.5          # Image scale (+/- gain)
    shear: 2.0          # Image shear (+/- deg)
    perspective: 0.0001 # Image perspective (+/- fraction)
    flipud: 0.0         # Flip up-down (probability)
    fliplr: 0.5         # Flip left-right (probability)
    mosaic: 1.0         # Mosaic augmentation (probability)
    mixup: 0.1          # MixUp augmentation (probability)
    copy_paste: 0.0     # Copy-paste augmentation (probability)

  # Regularization
  dropout: 0.0
  label_smoothing: 0.1

  # Validation
  patience: 50
  val: true

  # Misc
  seed: 42
  deterministic: true
  verbose: true
  workers: 8
  device: 0  # GPU device ID, or 'cpu'

# Dataset statistics (will be calculated by the pipeline)
statistics:
  # RGB normalization values (calculated from training set)
  mean_rgb: [0.485, 0.456, 0.406]  # Placeholder - will be calculated
  std_rgb: [0.229, 0.224, 0.225]   # Placeholder - will be calculated

  # Class distribution (will be calculated)
  class_distribution:
    normal:
      count: 0  # To be filled
      percentage: 0.0
    theft:
      count: 0  # To be filled
      percentage: 0.0

  # Split distribution (will be calculated)
  splits:
    train:
      images: 0
      percentage: 70.0
    valid:
      images: 0
      percentage: 15.0
    test:
      images: 0
      percentage: 15.0

# Data quality
quality:
  validation_performed: true
  checks:
    - missing_labels
    - invalid_coordinates
    - corrupted_images
    - empty_annotations
    - class_consistency

# Recommendations
recommendations:
  - Use data augmentation during training
  - Monitor validation metrics to prevent overfitting
  - Consider class balancing if distribution is skewed
  - Use mixed precision training for faster convergence
  - Implement early stopping based on validation mAP
  - Save checkpoints every 10 epochs
  - Use TensorBoard for monitoring
  - Validate on test set only after training completion

# Notes
notes: |
  This configuration file is generated by the data merging and preprocessing pipeline.

  Class Mapping Strategy:
  - B1 dataset: 6 classes mapped to 2 classes
    - normal: Customer-Bagpack, Product, Shopping-Cart, normal
    - theft: Product-Picked, theft
  - B2 dataset: 2 classes (already compatible)
  - B3 dataset: 2 classes (already compatible)

  Data Validation:
  - All bounding boxes validated to be in [0, 1] range
  - All images verified for integrity
  - All labels checked for consistency
  - Missing labels and corrupted files reported

  Training Tips:
  - Start with YOLOv8n for quick experiments
  - Use YOLOv8s or YOLOv8m for better accuracy
  - Increase epochs if validation loss is still decreasing
  - Adjust batch size based on GPU memory
  - Monitor both precision and recall metrics
  - Use confusion matrix to identify misclassification patterns

  For more information, see MERGE_REPORT.md
